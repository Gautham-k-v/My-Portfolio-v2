<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #07080c;
        color: #f4f6f8;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 88px;
      }
      .bar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 8px;
        background: linear-gradient(90deg, transparent, #9aa8ff, #c8b6ff, transparent);
      }
      .kicker {
        color: #9aa8ff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.22em;
      }
      h1 {
        margin: 22px 0 14px;
        font-size: 76px;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      p {
        margin: 0;
        color: #a7b0bf;
        font-size: 30px;
      }
      .meta {
        margin-top: 28px;
        color: #f4f6f8;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div>
      <div class="kicker">AVAILABLE FOR FREELANCE PROJECTS</div>
      <h1>Gautham Krishna V</h1>
      <p>MERN Stack Developer &amp; Freelance Web Developer</p>
      <p class="meta">Kerala, India</p>
    </div>
  </body>
</html>
